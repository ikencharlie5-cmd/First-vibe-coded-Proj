<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironhold</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="view" aria-label="Game world"></div>

  <div id="hud">
    <div id="hud-tl" class="hud-box">
      <div class="brand">IRONHOLD</div>
      <div id="hud-stats"></div>
    </div>
    <div id="hud-target" class="hud-box hidden"></div>
    <div id="hud-tr">
      <canvas id="minimap" width="190" height="190"></canvas>
      <div id="zone"></div>
    </div>
    <div id="prompt" class="hidden"></div>
    <div id="log"></div>
    <div id="hotbar">
      <button data-open="build"><kbd>B</kbd>Build</button>
      <button data-open="craft"><kbd>C</kbd>Craft</button>
      <button data-open="pack"><kbd>I</kbd>Pack</button>
      <button data-open="skills"><kbd>K</kbd>Skills</button>
      <button data-open="empire"><kbd>G</kbd>Empire</button>
      <button data-open="map"><kbd>M</kbd>Map</button>
      <button data-open="help"><kbd>H</kbd>Help</button>
      <button id="btn-save">Save</button>
      <button id="btn-reset" class="danger">Reset</button>
    </div>
  </div>

  <div id="panel" class="hidden">
    <div class="panel-head">
      <span id="panel-title"></span>
      <button id="panel-close" aria-label="Close">&times;</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <script src="js/lib/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render3d.js"></script>
</body>
</html>
