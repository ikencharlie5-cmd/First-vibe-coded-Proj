<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironhold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="view" aria-label="Game world"></div>

  <div id="hud">
    <div id="hud-tl" class="frame">
      <div class="brand">Ironhold</div>
      <div id="hud-stats"></div>
      <div id="quest-track" title="Quests (J)"></div>
    </div>
    <div id="hud-target" class="frame hidden"></div>
    <div id="hud-tr">
      <div class="minimap-ring"><canvas id="minimap" width="190" height="190"></canvas></div>
      <div id="zone"></div>
      <div id="clock"></div>
    </div>
    <div id="toasts"></div>
    <div id="prompt" class="frame hidden"></div>
    <div id="log"></div>
    <div id="hotbar" class="frame">
      <button data-open="build" data-icon="hammer" title="Build (B)"><kbd>B</kbd></button>
      <button data-open="craft" data-icon="anvil" title="Craft (C)"><kbd>C</kbd></button>
      <button data-open="pack" data-icon="bag" title="Pack (I)"><kbd>I</kbd></button>
      <button data-open="skills" data-icon="star" title="Skills (K)"><kbd>K</kbd></button>
      <button data-open="empire" data-icon="castle" title="Empire (G)"><kbd>G</kbd></button>
      <button data-open="quests" data-icon="scroll" title="Quests (J)"><kbd>J</kbd></button>
      <button data-open="map" data-icon="map" title="World map (M)"><kbd>M</kbd></button>
      <button data-open="help" data-icon="book" title="Help (H)"><kbd>H</kbd></button>
      <button data-open="settings" data-icon="gear" title="Settings (Esc)"><kbd>Esc</kbd></button>
    </div>
  </div>

  <div id="panel" class="hidden">
    <div class="panel-head">
      <span id="panel-icon"></span>
      <span id="panel-title"></span>
      <button id="panel-close" aria-label="Close">&times;</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <script src="js/lib/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/story.js"></script>
  <script src="js/caravans.js"></script>
  <script src="js/render3d.js"></script>
</body>
</html>
